[mod-setting-name]
blinking-ghosts-ghost-tint=Entity ghost tint colour
blinking-ghosts-ghost-delivery-tint=Fulfilled entity ghost tint colour
blinking-ghosts-tile-ghost-tint=Tile ghost tint colour
blinking-ghosts-tile-ghost-delivery-tint=Fulfilled tile ghost tint colour
blinking-ghosts-blink-enabled-entity=Enable blinking entity ghost icon
blinking-ghosts-blink-enabled-tile=Enable blinking tile ghost icon
blinking-ghosts-blink-rate=Icon blink rate (seconds)
blinking-ghosts-blink-scale=Icon scale
blinking-ghosts-blink-disable-flash=Disable icon flashing

[mod-setting-description]
blinking-ghosts-blink-disable-flash=While blinking ghost icons are enabled, keep icons statically on instead of flashing.

[shortcut-name]
blinking-ghosts-toggle-shortcut-entity=Toggle blinking entity ghost icon
blinking-ghosts-toggle-shortcut-tile=Toggle blinking tile ghost icon
